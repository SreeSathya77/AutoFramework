[pytest]
# Removed --alluredir to fix the 'iter_parents' error
# Added --hold to default options for your convenience
addopts = --html=reports/html_report.html --self-contained-html --hold
testpaths = tests/ui
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - %(levelname)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
