[pytest]
# Changed to lowercase 'base_url' so the pytest-base-url plugin recognizes it
base_url = http://operator-qa.qmaastech.com/

# Added --base-url to addopts to ensure it's forced into the test session
# Kept your existing HTML report and hold settings
addopts = --base-url http://operator-qa.qmaastech.com/ --html=reports/html_report.html --self-contained-html --hold -x

testpaths = tests/ui
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# CLI Logging Configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s - %(levelname)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S